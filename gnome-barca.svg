<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 480" width="460" height="480" role="img" aria-label="Garden gnome in an FC Barcelona shirt kicking a football">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6e6ff"/><stop offset="1" stop-color="#f0faff"/>
    </linearGradient>
    <radialGradient id="grass" cx="0.5" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#78cc52"/><stop offset="1" stop-color="#3c8a29"/>
    </radialGradient>
    <linearGradient id="hatg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e33b2e"/><stop offset="0.6" stop-color="#c81f16"/><stop offset="1" stop-color="#9d150f"/>
    </linearGradient>
    <linearGradient id="beardg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9dee6"/>
    </linearGradient>
    <path id="torso" d="M148 236 C136 244 128 268 126 300 C124 326 128 344 132 354 L248 354 C252 344 256 326 254 300 C252 268 244 244 232 236 C216 227 164 227 148 236 Z"/>
    <clipPath id="torsoClip"><use href="#torso"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="460" height="480" fill="url(#sky)"/>
  <ellipse cx="230" cy="432" rx="235" ry="70" fill="url(#grass)"/>
  <g stroke="#2f7a20" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <path d="M40 420 l6 -14"/><path d="M70 438 l5 -13"/><path d="M400 424 l6 -14"/>
    <path d="M370 444 l5 -12"/><path d="M120 452 l6 -13"/><path d="M300 452 l5 -13"/>
  </g>
  <ellipse cx="200" cy="428" rx="86" ry="17" fill="#000" opacity="0.18"/>

  <!-- back leg (planted) -->
  <g stroke-linecap="round" fill="none">
    <path d="M172 352 L166 396" stroke="#f0c49b" stroke-width="24"/>
    <path d="M166 392 L164 418" stroke="#A50044" stroke-width="24"/>
    <path d="M166 372 L165 384" stroke="#004D98" stroke-width="24"/>
  </g>
  <path d="M150 420 C146 410 182 408 184 418 C192 420 196 426 194 430 L146 430 C142 428 144 422 150 420 Z" fill="#141821"/>

  <!-- kicking leg -->
  <g stroke-linecap="round" fill="none">
    <path d="M228 350 L272 372" stroke="#f0c49b" stroke-width="26"/>
    <path d="M272 372 L316 390" stroke="#A50044" stroke-width="23"/>
    <path d="M280 376 L292 381" stroke="#004D98" stroke-width="23"/>
  </g>
  <path d="M310 380 C322 376 348 384 350 394 C352 404 340 406 328 402 L308 396 Z" fill="#141821"/>
  <path d="M312 398 L346 400" stroke="#f7d23a" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- shorts -->
  <path d="M132 336 L248 336 C250 358 246 378 240 384 C226 390 214 384 210 372 L200 352 L188 372 C182 384 168 388 156 382 C148 376 134 358 132 336 Z" fill="#12336e"/>
  <path d="M133 342 L247 342" stroke="#0a2450" stroke-width="3"/>

  <!-- shirt -->
  <g clip-path="url(#torsoClip)">
    <rect x="120" y="220" width="140" height="145" fill="#A50044"/>
    <g fill="#004D98">
      <rect x="126" y="220" width="18" height="145"/>
      <rect x="162" y="220" width="18" height="145"/>
      <rect x="198" y="220" width="18" height="145"/>
      <rect x="234" y="220" width="18" height="145"/>
    </g>
    <path d="M120 240 C160 262 210 262 262 238 L262 220 L120 220 Z" fill="#000" opacity="0.12"/>
  </g>
  <use href="#torso" fill="none" stroke="#5c1030" stroke-width="2.5"/>

  <!-- arms -->
  <g fill="none" stroke-linecap="round">
    <path d="M140 250 L112 296 L104 334" stroke="#f0c49b" stroke-width="21"/>
    <path d="M140 250 L122 280" stroke="#A50044" stroke-width="27"/>
    <path d="M133 262 L127 272" stroke="#004D98" stroke-width="27"/>
    <path d="M242 248 L288 236 L308 208" stroke="#f0c49b" stroke-width="21"/>
    <path d="M242 248 L276 239" stroke="#A50044" stroke-width="27"/>
    <path d="M256 245 L266 242" stroke="#004D98" stroke-width="27"/>
  </g>
  <circle cx="102" cy="338" r="13" fill="#f0c49b"/>
  <circle cx="311" cy="203" r="13" fill="#f0c49b"/>

  <!-- head -->
  <circle cx="190" cy="196" r="47" fill="#f6cda6"/>
  <circle cx="169" cy="186" r="4.6" fill="#2b2118"/>
  <circle cx="212" cy="186" r="4.6" fill="#2b2118"/>
  <path d="M158 170 C166 162 178 162 184 168" stroke="#cfd4dc" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M222 170 C214 162 202 162 196 168" stroke="#cfd4dc" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="150" cy="206" r="10" fill="#eda9a0" opacity="0.7"/>
  <circle cx="231" cy="206" r="10" fill="#eda9a0" opacity="0.7"/>

  <!-- beard + moustache -->
  <path d="M147 200 C132 244 138 296 158 316 C168 326 180 328 188 318 C192 328 206 330 218 322 C244 304 254 248 241 199 C232 226 158 228 147 200 Z" fill="url(#beardg)"/>
  <path d="M190 212 C176 208 160 214 158 226 C170 222 182 224 190 230 C198 224 210 222 222 226 C220 214 204 208 190 212 Z" fill="#ffffff" stroke="#d3d9e1" stroke-width="1.5"/>
  <ellipse cx="190" cy="216" rx="17" ry="14" fill="#eeae86"/>
  <ellipse cx="185" cy="212" rx="6" ry="4.5" fill="#f8cfae" opacity="0.8"/>
  <path d="M170 262 C180 270 200 270 210 262" stroke="#c8ced7" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- hat -->
  <path d="M118 180 C122 132 138 88 162 56 C172 40 190 30 202 36 C215 43 214 58 206 70 C230 110 248 148 258 180 C216 194 158 194 118 180 Z" fill="url(#hatg)"/>
  <path d="M118 180 C158 194 216 194 258 180 C258 190 246 198 230 202 C206 208 162 206 140 198 C126 193 118 187 118 180 Z" fill="#8f1009"/>
  <path d="M162 56 C150 96 142 140 140 184" stroke="#ff7a6b" stroke-width="5" fill="none" opacity="0.45" stroke-linecap="round"/>
  <circle cx="205" cy="42" r="12" fill="#fdfdfd" stroke="#dfe3e9" stroke-width="2"/>

  <!-- ball -->
  <g transform="translate(378 400)">
    <circle r="32" fill="#fdfdfd" stroke="#c4cad3" stroke-width="2"/>
    <path d="M0 -17 L16 -5 L10 14 L-10 14 L-16 -5 Z" fill="#1a1d24"/>
    <path d="M0 -32 L0 -17 M16 -5 L31 -10 M10 14 L19 27 M-10 14 L-19 27 M-16 -5 L-31 -10" stroke="#1a1d24" stroke-width="4"/>
    <path d="M-14 -26 L0 -32 L14 -26" fill="none" stroke="#1a1d24" stroke-width="4" stroke-linejoin="round"/>
    <path d="M28 18 L31 -10" fill="none" stroke="#1a1d24" stroke-width="4"/>
    <path d="M-28 18 L-31 -10" fill="none" stroke="#1a1d24" stroke-width="4"/>
    <ellipse cx="-10" cy="-14" rx="9" ry="6" fill="#fff" opacity="0.55"/>
  </g>
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M424 380 C434 392 434 410 424 422"/>
    <path d="M440 368 C456 386 456 416 440 434"/>
  </g>
</svg>
